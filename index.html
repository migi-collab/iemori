<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おうちのしおり 体験版</title>
<meta name="description" content="宅飲みの家主が、家の案内を友達に共有するアプリ案の体験版。見本の家が入っていて、家主側と参加者側の画面を自由に触れます。">
<meta property="og:title" content="おうちのしおり 体験版">
<meta property="og:description" content="家主が一度だけ家の情報を登録して、URLを送るだけ。場所や買い出しの確認のついでに、家のルールも嫌味なく伝わります。">
<meta property="og:type" content="website">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  --bg:#E6EAEE; --panel:#F4F6F8; --screen:#FFFFFF; --sunk:#F1F3F6;
  --ink:#1D2733; --muted:#5E6A77; --line:#D8DEE5;
  --accent:#F2B23A; --accent-ink:#3A2805; --accent-soft:#FCEFD3;
  --btn:#24324A; --btn-ink:#FFFFFF; --danger:#B3261E;
  --frame:#1B222C;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F141A; --panel:#151B22; --screen:#1A212A; --sunk:#222A34;
    --ink:#E6EBF0; --muted:#9BA7B3; --line:#2E3844;
    --accent:#F2B23A; --accent-ink:#2A1C02; --accent-soft:#3A2E15;
    --btn:#F2B23A; --btn-ink:#231802; --danger:#F2A09A; --frame:#05080B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F141A; --panel:#151B22; --screen:#1A212A; --sunk:#222A34;
  --ink:#E6EBF0; --muted:#9BA7B3; --line:#2E3844;
  --accent:#F2B23A; --accent-ink:#2A1C02; --accent-soft:#3A2E15;
  --btn:#F2B23A; --btn-ink:#231802; --danger:#F2A09A; --frame:#05080B;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6;padding-inline:16px;padding-block:24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}

.stage{max-width:980px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:40px;align-items:start}
.stage.solo{grid-template-columns:390px;justify-content:center}
.story h1{font-family:var(--display);font-size:28px;line-height:1.3;margin:0 0 6px;text-wrap:balance}
.story .lead{color:var(--muted);margin:0 0 20px;max-width:34em}
.story .tag{display:inline-block;font-size:11px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-bottom:12px}
.scenes{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.scenes button{width:100%;text-align:left;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;background:transparent;border:1px solid transparent;border-radius:12px;padding:10px 12px}
.scenes button:hover{background:var(--panel)}
.scenes button[aria-current="true"]{background:var(--panel);border-color:var(--line)}
.scenes .n{font-family:var(--display);font-weight:700;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-size:13px}
.scenes button[aria-current="true"] .n{background:var(--accent);color:var(--accent-ink)}
.scenes .when{font-size:11px;color:var(--muted);letter-spacing:.04em}
.scenes .what{font-weight:700;display:block}
.scenes .why{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.note{margin-top:20px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

.phone{width:390px;max-width:100%;height:780px;border-radius:44px;background:var(--frame);padding:12px;box-shadow:0 30px 60px -30px rgba(10,20,30,.45)}
.screen{position:relative;height:100%;border-radius:34px;overflow:hidden;background:var(--screen);display:flex;flex-direction:column}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:24px;border-radius:14px;background:var(--frame);z-index:5}
.statusbar{height:40px;flex:none;display:flex;justify-content:space-between;align-items:end;padding:0 26px 4px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 24px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--screen);padding:6px 6px 14px}
.tabbar button{background:none;border:0;border-radius:10px;padding:6px 0;font-size:11px;color:var(--muted);display:grid;justify-items:center;gap:2px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="true"]{color:var(--ink);font-weight:700}
.tabbar button[aria-current="true"] svg{color:var(--accent)}
.footbar{flex:none;display:flex;gap:8px;border-top:1px solid var(--line);background:var(--screen);padding:10px 16px 16px}
.footbar .primary{flex:1}
.footbar .secondary{width:auto;padding:12px 16px}

.hdr{padding:10px 0 14px}
.hdr .eyebrow{font-size:11px;color:var(--muted);letter-spacing:.06em}
.hdr h2{font-family:var(--display);font-size:24px;margin:2px 0 0;line-height:1.3;text-wrap:balance}
.hdr .sub{font-size:12px;color:var(--muted)}
.sec{margin-top:20px}
.sec > h3{font-size:13px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec > h3 small{font-weight:400;color:var(--muted);font-size:11px}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label,.lbl{font-size:12px;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--screen);border-radius:12px;padding:10px 12px}
textarea.input{resize:vertical;min-height:64px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(-45deg,transparent 50%,var(--muted) 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.input-row{display:flex;gap:8px;align-items:center}
.input-row .input{flex:1;min-width:0}
.ghost{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:8px 12px;font-size:12px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--screen);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.chip.add::before{content:"＋ ";color:var(--muted)}
.chip:disabled{opacity:.45;cursor:default}
.primary{width:100%;border:0;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-weight:700;padding:14px;font-size:15px}
.primary:disabled{opacity:.5}
.secondary{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--screen);padding:12px;font-weight:700}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--screen)}
.muted{color:var(--muted)}
.small{font-size:12px}
.kbd{font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-size:12px}

/* register */
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.progress button{border:0;background:none;padding:4px 0 0;display:grid;gap:4px;font-size:10.5px;color:var(--muted);text-align:left}
.progress button::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.progress button.done::before{background:var(--accent)}
.progress button[aria-current="true"]{color:var(--ink);font-weight:700}
.progress button[aria-current="true"]::before{background:var(--btn)}
.where{display:flex;gap:8px;align-items:flex-start;background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted);margin-bottom:14px}
.where b{color:var(--ink)}
.samplebar{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--muted);margin-bottom:12px}
.locate{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;display:grid;gap:10px}
.locate .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.locate .head b{font-size:13px}
.locbtn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:12.5px;padding:8px 14px;white-space:nowrap}
.locbtn:disabled{opacity:.6}
.cands{display:grid}
.cand{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.cand:last-child{border-bottom:0}
.cand input{width:18px;height:18px;margin:0;accent-color:var(--btn)}
.cand .kind{display:block;font-size:11px;color:var(--muted)}
.cand.added{opacity:.5}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.cattabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.cattabs::-webkit-scrollbar{display:none}
.cattabs button{flex:none;border:1px solid var(--line);background:var(--screen);border-radius:10px;padding:6px 10px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.cattabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:700}
.cattabs .c{font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;background:var(--sunk);color:var(--muted);padding:0 5px}
.cattabs button[aria-pressed="true"] .c{background:var(--accent);color:var(--accent-ink)}
.catlabel{font-size:11px;color:var(--muted);letter-spacing:.04em;margin:12px 0 6px}
.catlabel:first-child{margin-top:0}
.fetched{background:var(--sunk);border-radius:12px;padding:8px 12px}
.fetched .tbl td{padding:7px 2px;font-size:12.5px}
.shopadd{display:flex;gap:8px;margin-top:10px}
.shopadd .input{flex:1;min-width:0}
.shopadd .ghost{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:700;padding:8px 16px}
.shop .row .x{border:0;background:none;color:var(--muted);font-size:15px;padding:0 4px;line-height:1}
.shop .row .r{display:flex;gap:6px;align-items:center}
.pill.added{border:1px dashed var(--muted);color:var(--muted)}
.editrow{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;margin-bottom:8px}
.editrow .top{display:flex;gap:8px;align-items:center}
.editrow .top .input{flex:1;min-width:0}
.del{border:0;background:none;color:var(--muted);font-size:12px;padding:6px 4px;white-space:nowrap}
.del:hover{color:var(--danger)}
.mini{display:grid;grid-template-columns:110px 1fr 76px;gap:6px}
.mini .input{padding:9px 10px;min-width:0}
.askrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.askrow span{flex:1}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--screen);font-size:12.5px}
.days button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:700}
.empty{border:1px dashed var(--line);border-radius:14px;padding:14px;text-align:center;font-size:12.5px;color:var(--muted)}
.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:#3DAA6D}
.status.dirty i{background:var(--accent)}

/* guest */
.placecard{display:grid;gap:6px}
.placecard .addr{font-size:13px}
.maplink{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;text-decoration:none;background:var(--screen);white-space:nowrap}
.spotlist{display:grid}
.spot{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13px}
.spot:last-child{border-bottom:0}
.spot .kind{font-size:11px;color:var(--muted);display:block}
.spot .r{display:flex;gap:8px;align-items:center}
.itemgrid{display:flex;flex-wrap:wrap;gap:6px}
.detail{margin-top:10px;background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:13px}
.detail .aside{display:block;margin-top:6px;font-size:12.5px}
.asks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.asks li{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:baseline;font-size:13.5px}
.asks li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);transform:translateY(-2px)}
.softbox{background:var(--accent-soft);border-radius:16px;padding:14px}
.softbox h3{margin:0 0 8px;font-size:13px}
.shop{display:grid}
.shop .row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.shop .row:last-child{border-bottom:0}
.shop input{width:18px;height:18px;margin:0;accent-color:var(--btn)}
.pill{font-size:11px;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.have{background:var(--accent-soft);border:1px solid var(--accent)}
.pill.buy{border:1px solid var(--line);color:var(--muted)}
.shop .row.done .nm{text-decoration:line-through;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td{padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:nth-child(2){font-weight:700;white-space:nowrap}
.tbl td:last-child{text-align:right;white-space:nowrap}
.next{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--accent);color:var(--accent-ink)}
.next.later{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:400}
.big{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.split{display:grid;gap:8px}
.split .row{display:flex;justify-content:space-between;align-items:baseline;background:var(--sunk);border-radius:12px;padding:12px 14px}
.split .row b{font-variant-numeric:tabular-nums;font-size:18px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--screen);font-size:18px;line-height:1}
.stepper output{min-width:48px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:13px;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--screen);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.guestbanner{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:6px 10px;margin-top:4px}

.line-mock{background:#8CABD9;border-radius:16px;padding:12px;display:grid;gap:8px}
.bubble{justify-self:end;max-width:90%;background:#8DE055;color:#111;border-radius:14px;padding:8px 12px;font-size:13px;white-space:pre-wrap;word-break:break-all}
.linebar{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#fff;font-weight:700}
.log{display:grid}
.log .row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.log .row:last-child{border-bottom:0}
.log .d{font-variant-numeric:tabular-nums;font-weight:700}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:var(--sunk);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.loading{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}
.loading b{display:block;font-family:var(--display);font-size:22px;color:var(--ink)}
.toast{position:absolute;left:16px;right:16px;bottom:90px;background:var(--ink);color:var(--screen);border-radius:12px;padding:10px 14px;font-size:13px;z-index:10}

@media (max-width:860px){
  .stage,.stage.solo{grid-template-columns:1fr;gap:20px;justify-items:center}
  .story{width:100%;max-width:390px}
  .story .lead,.story .note,.scenes .why,.story .tag{display:none}
  .story h1{font-size:20px}
  .scenes{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  .scenes li{flex:none}
  .scenes button{grid-template-columns:22px auto;padding:6px 10px;border-color:var(--line)}
  .scenes .n{width:22px;height:22px;font-size:11px}
  .scenes .when{display:none}
  .scenes .what{font-size:12px;white-space:nowrap}
}
@media (max-width:440px){
  body{padding-inline:0;padding-block:0}
  .story{padding:12px 16px 0}
  .phone{width:100%;height:auto;border-radius:0;padding:0;background:transparent;box-shadow:none}
  .screen{border-radius:0;height:calc(100dvh - 96px)}
  .stage.solo .screen{height:100dvh}
  .notch,.statusbar{display:none}
  .mini{grid-template-columns:1fr 1fr 64px}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <aside class="story" id="story" hidden>
    <span class="tag">体験版</span>
    <h1>おうちのしおり<span class="muted" style="font-size:.55em;font-weight:500">（仮）</span></h1>
    <p class="lead">家主が一度だけ家の情報を登録して、URLをLINEで送るだけ。参加者は場所や買い出しの確認で自然と開き、その中で家のルールも嫌味なく目に入ります。</p>
    <ol class="scenes" id="scenes"></ol>
    <p class="note" id="modeNote"></p>
  </aside>

  <div class="phone">
    <div class="screen">
      <div class="notch" aria-hidden="true"></div>
      <div class="statusbar" aria-hidden="true"><span id="clock"></span><span>5G ▮▮▮</span></div>
      <div class="view" id="view"><div class="loading"><div><b>おうちのしおり</b>読み込み中…</div></div></div>
      <div class="footbar" id="footbar" hidden></div>
      <nav class="tabbar" id="tabbar" hidden></nav>
      <div class="toast" id="toast" hidden></div>
    </div>
  </div>
</div>

<script>
(function(){
const DEMO=true; // true = 誰でも開ける体験版（共有ストレージを使わず、見本の家を最初から入れる）
const PAGE_URL='https://migi-collab.github.io/ouchi-shiori/';
const HOME_PATH='homes/main', LOG_PATH='private/log';
const W='日月火水木金土';

const SCENES=[
  {id:'host-form', when:'宅飲み前（一度だけ）', what:'家主が家を登録', why:'5つのステップで入力。お願いごとは「家の案内」の一部として登録する。'},
  {id:'host-share',when:'場所が決まったら', what:'LINEにURLを送る', why:'参加者はリンクを開くだけ。'},
  {id:'guest-guide',when:'向かう途中・宅飲み中', what:'参加者が家の案内を見る', why:'場所や備品を見るついでに「ちょっとだけお願い」が目に入る。'},

/* ---------- persistence ---------- */
async function saveHome(){
  const next=clone(DRAFT);
  if(same(next,HOME))return true;
  if(MODE==='owner'){
    try{await DB.doc(HOME_PATH).set(Object.assign({},next,{updatedAt:Date.now()}));}
    catch(e){toast('保存できませんでした。通信状態を確かめてもう一度押してください');return false}
  }else{lsSet('oshiori-home',next)}
  HOME=next;lsSet('oshiori-draft',null);
  return true;
}
async function saveLog(){
  if(MODE==='owner'){try{await DB.doc(LOG_PATH).set(LOG)}catch(e){toast('記録できませんでした');return false}}
  else lsSet('oshiori-log',LOG);
  return true;
}
function stashDraft(){lsSet('oshiori-draft',DRAFT)}

async function shopWrite(id,data){
  const prev=SHOPDOCS[id];
  if(data)SHOPDOCS[id]=data;else delete SHOPDOCS[id];
  if(MODE==='local'){lsSet('oshiori-shop',SHOPDOCS);return true}
  try{const ref=DB.doc('shop/'+id);if(data)await ref.set(data);else await ref.delete();return true}
  catch(e){
    if(prev)SHOPDOCS[id]=prev;else delete SHOPDOCS[id];
    if(e&&e.code==='invalid_argument'){SHOP_RO=true;toast('追加・チェックするには、家主に「コントリビューター」として招待してもらってください')}
    else toast('保存できませんでした。もう一度試してください');
    return false;
  }
}
function nextDate(days){
  const now=new Date();
  for(let k=0;k<=7;k++){const d=new Date(now);d.setDate(now.getDate()+k);if(days.includes(d.getDay()))return {d,k}}
  return null;
}
function guestTrash(){
  const t=HOME.trash;
  const rows=t.rows.filter(r=>r.kind.trim()).map(r=>({...r,n:nextDate(r.days)}));
  const ks=rows.filter(r=>r.n).map(r=>r.n.k);const soon=ks.length?Math.min(...ks):-1;
  const notes=(t.notes||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const label=n=>!n?'—':n.k===0?'今日':n.k===1?'明日':(n.d.getMonth()+1)+'/'+n.d.getDate()+'('+W[n.d.getDay()]+')';
  const trashAsk=HOME.asks.find(a=>a.includes('ゴミ'));
  return guestTop(`${esc(t.area)||'この家'}のゴミの日・分け方`)+`
  ${rows.length?`<div class="card" style="padding:4px 12px"><table class="tbl"><tbody>${rows.map(r=>`<tr><td>${esc(r.kind)}</td><td>${r.days.length?[1,2,3,4,5,6,0].filter(w=>r.days.includes(w)).map(w=>W[w]).join('・'):'—'}</td><td>${r.n?`<span class="next ${r.n.k===soon?'':'later'}">次は${label(r.n)}</span>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ゴミの日は登録されていません</div>'}
  ${notes.length?`<div class="sec"><h3>分け方</h3><ul class="asks">${notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:''}
  ${(t.bagPlace||trashAsk)?`<div class="sec softbox"><h3>この家では</h3><ul class="asks">${t.bagPlace?`<li>ゴミ袋：${esc(t.bagPlace)}</li>`:''}${trashAsk?`<li>${esc(trashAsk)}</li>`:''}</ul></div>`:''}`;
}
function calc(){
  const slope=G.slope??HOME.slope??0;
  const even=G.total/G.people;
  const host=Math.max(0,even-slope);
  const friend=G.people>1?(G.total-host)/(G.people-1):G.total;
  return {slope,even,host:Math.floor(host),friend:Math.ceil(friend)};
}

  const c=calc();

const VIEWS={'host-form':hostForm,'host-share':hostShare,'host-log':hostLog,'guest-guide':guestGuide,'guest-shop':guestShop,'guest-trash':guestTrash,'guest-split':guestSplit};
const TABS=[['guest-guide','案内','home'],['guest-shop','買い出し','cart'],['guest-trash','ゴミ','trash'],['guest-split','割り勘','yen']];
function go(id,keep){
  if(MODE==='guest'&&!id.startsWith('guest'))id='guest-guide';
  current=id;
  const v=$('#view');const top=v.scrollTop;
  const guest=id.startsWith('guest');
  const keepIn=keep&&document.activeElement&&document.activeElement.id==='shop-new';const keepVal=$('#shop-new')?$('#shop-new').value:'';
  v.innerHTML=(guest&&!hasHome(HOME))?guestEmpty():VIEWS[id]();
  const sn=$('#shop-new');if(sn&&keep){sn.value=keepVal;if(keepIn)sn.focus()}
  v.scrollTop=keep?top:0;
  const tb=$('#tabbar');tb.hidden=!guest||!hasHome(HOME);
  if(!tb.hidden)tb.innerHTML=TABS.map(([t,l,ic])=>`<button type="button" data-go="${t}" aria-current="${t===id}">${IC[ic]}<span>${l}</span></button>`).join('');
  const fb=$('#footbar');fb.hidden=id!=='host-form';if(!fb.hidden)fb.innerHTML=formFooter();
  renderScenes();
  const cur=document.querySelector('.scenes [aria-current="true"]');
  if(cur&&window.matchMedia('(max-width:860px)').matches)cur.scrollIntoView({block:'nearest',inline:'center'});
}
const rerender=()=>go(current,true);

/* ---------- path helpers ---------- */
function setPath(obj,path,val){const k=path.split('.');let o=obj;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val}
function delPath(obj,path){const k=path.split('.');const idx=+k.pop();let o=obj;for(const s of k)o=o[s];o.splice(idx,1)}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const d=b.dataset;
  if(d.go){if(current==='host-form'&&!same(DRAFT,HOME)&&hasHome(DRAFT)){if(!(await saveHome()))return}go(d.go);return}
  if(d.step!==undefined){if(!same(DRAFT,HOME)&&hasHome(DRAFT))await saveHome();step=+d.step;clearArmed=false;go('host-form');return}
  if(d.del){delPath(DRAFT,d.del);stashDraft();rerender();return}
  if(d.addspot){DRAFT.spots.push({kind:d.addspot,name:'',min:''});stashDraft();rerender();focusLast('[id^="sp-n-"]');return}
  if(d.icat){ICAT=d.icat;rerender();return}
  if(d.additem!==undefined){const p=presetOf(d.additem);DRAFT.items.push({cat:ICAT,name:d.additem,note:p?p.note:'',ask:''});stashDraft();rerender();focusLast(p?'[id^="it-d-"]':'[id^="it-n-"]');return}
  if(d.addask){DRAFT.asks.push(d.addask);stashDraft();rerender();return}
  if(d.day){const [i,w]=d.day.split('.').map(Number);const r=DRAFT.trash.rows[i];r.days=r.days.includes(w)?r.days.filter(x=>x!==w):r.days.concat(w);stashDraft();rerender();return}
  if(d.slope!==undefined){DRAFT.slope=+d.slope;stashDraft();rerender();return}
  if(d.gitem!==undefined){G.item=+d.gitem;rerender();return}
  if(d.gslope!==undefined){G.slope=+d.gslope;rerender();return}
  if(d.ppl){G.people=Math.min(30,Math.max(2,G.people+(+d.ppl)));rerender();return}
  if(d.sdel){e.preventDefault();await shopWrite(d.sdel,null);rerender();return}
  if(d.dellog){LOG.visits=LOG.visits.filter(v=>v.id!==d.dellog);await saveLog();rerender();return}
  switch(d.act){
    case 'sample':DRAFT=SAMPLE();stashDraft();rerender();toast('見本を入れました。自分の家に書き換えてください');break;
    case 'clear':if(!clearArmed){clearArmed=true;rerender();break}clearArmed=false;DRAFT=EMPTY();stashDraft();rerender();break;
    case 'addask':{const inp=$('#f-newask');const v=inp.value.trim();if(!v){inp.focus();break}DRAFT.asks.push(v);stashDraft();rerender();toast('追加しました');setTimeout(()=>{const n=$('#f-newask');if(n)n.focus()},0);break}
    case 'locate':
      // 本番：navigator.geolocation で現在地を取り、地図APIで周辺のお店を検索する
      NEAR={state:'loading',pick:{}};rerender();
      setTimeout(()=>{NEAR.state='done';NEARBY_SAMPLE.forEach((c,i)=>{if(c.min<=6&&!DRAFT.spots.some(p=>p.name===c.name))NEAR.pick[i]=true});if(current==='host-form'&&step===1)rerender()},1200);
      break;
    case 'addpicked':{
      const add=NEARBY_SAMPLE.filter((c,i)=>NEAR.pick[i]&&!DRAFT.spots.some(p=>p.name===c.name));
      add.forEach(c=>DRAFT.spots.push({kind:c.kind,name:c.name,min:String(c.min)}));
      NEAR.pick={};stashDraft();rerender();toast(add.length+'件追加しました');break}
    case 'fetchtrash':{
      // 本番：住所→市区町村を判定し、自治体のゴミ収集データを取得する
      const city=cityOf(DRAFT.address);
      TFETCH={state:'loading',res:null};rerender();
      setTimeout(()=>{const src=TRASH_SAMPLE[city]||TRASH_SAMPLE._default;TFETCH={state:'done',res:{area:city,rows:clone(src.rows),notes:src.notes}};if(current==='host-form'&&step===4)rerender()},1200);
      break}
    case 'applytrash':{
      const f=TFETCH.res;if(!f)break;
      DRAFT.trash.area=f.area||DRAFT.trash.area;DRAFT.trash.rows=clone(f.rows);DRAFT.trash.notes=f.notes;
      TFETCH={state:'idle',res:null};stashDraft();rerender();toast('ゴミの日と分け方を入れました');break}
    case 'addtrash':DRAFT.trash.rows.push({kind:'',days:[]});stashDraft();rerender();focusLast('[id^="tr-k-"]');break;
    case 'prev':step=Math.max(0,step-1);go('host-form');break;
    case 'next':
      if(!DRAFT.name.trim()){step=0;go('host-form');toast('家の呼び方を入れてください');setTimeout(()=>$('#f-name')&&$('#f-name').focus(),0);break}
      b.disabled=true;
      if(!(await saveHome())){b.disabled=false;break}
      if(step<4){step++;go('host-form');toast('保存しました')}else{go('host-share');toast('保存しました。友達の画面に反映されています')}
      break;
    case 'copy':{const ta=$('#share-msg');const txt=ta.value;
      try{navigator.clipboard.writeText(txt).then(()=>toast('コピーしました。LINEに貼ってください'),()=>{ta.select();toast('選択しました。長押しでコピーできます')})}catch(err){ta.select();toast('選択しました。長押しでコピーできます')}break}
    case 'addlog':{const date=$('#lg-date').value;if(!date){toast('日付を入れてください');break}
      LOG.visits=(LOG.visits||[]).concat({id:Date.now().toString(36),date,who:$('#lg-who').value.trim(),n:parseInt($('#lg-n').value,10)||'',memo:$('#lg-memo').value.trim()});
      if(await saveLog()){rerender();toast('記録しました')}break}
    case 'shopadd':{
      const inp=$('#shop-new');const names=inp.value.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean);
      if(!names.length){inp.focus();break}
      inp.value='';
      for(const n of names){const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);if(!(await shopWrite(id,{name:n.slice(0,40),done:false,createdAt:Date.now()})))break}
      rerender();const n2=$('#shop-new');if(n2)n2.focus();break}
    case 'shopreset':
      if(!resetArmed){resetArmed=true;rerender();break}
      resetArmed=false;
      for(const id of Object.keys(SHOPDOCS)){if(!(await shopWrite(id,null)))break}
      rerender();toast('リストをリセットしました');break;
    case 'paypay':toast('デモのため送金は行いません');break;
  }
});
function focusLast(sel){const els=document.querySelectorAll(sel);if(els.length)els[els.length-1].focus()}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){let v=t.value;if(t.dataset.num)v=v.replace(/[^\d]/g,'');setPath(DRAFT,t.dataset.f,v);stashDraft();
    const st=document.querySelector('.hdr .status');if(st)st.outerHTML=statusChip();return}
  if(t.id==='share-msg'){const b=$('#bubble');if(b)b.textContent=t.value}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='shop-new'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();const b=document.querySelector('[data-act="shopadd"]');if(b)b.click();return}
  if(e.target.id==='f-newask'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();const b=document.querySelector('[data-act="addask"]');if(b)b.click()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f&&t.tagName==='SELECT'){setPath(DRAFT,t.dataset.f,t.value);stashDraft();return}
  if(t.dataset.pick!==undefined){NEAR.pick[t.dataset.pick]=t.checked;rerender();return}
  if(t.dataset.sdone!==undefined){const id=t.dataset.sdone;const cur=SHOPDOCS[id]||{};shopWrite(id,Object.assign({},cur,{done:t.checked})).then(()=>rerender());return}
  if(t.id==='g-total'){const n=parseInt(t.value.replace(/[^\d]/g,''),10);G.total=isNaN(n)?0:n;rerender();return}
});

/* ---------- boot ---------- */
async function boot(){
  let db=null,user=null;
  if(db){
    DB=db;
    const canEdit=user?await user.canEdit():false;
    MODE=canEdit?'owner':'guest';
    try{const s=await db.doc(HOME_PATH).get();HOME=s.exists?norm(s.data()):null}catch(e){HOME=null}
    if(MODE==='owner'){
      try{const l=await db.doc(LOG_PATH).get();if(l.exists)LOG=Object.assign({visits:[]},l.data())}catch(e){}
    }
    db.doc(HOME_PATH).onSnapshot(s=>{
      const next=s.exists?norm(s.data()):null;if(next)delete next.updatedAt;
      if(same(next,HOME))return;HOME=next;
      if(current&&current!=='host-form')rerender();
    },()=>{});
    db.collection('shop').onSnapshot(q=>{
      const m={};q.docs.forEach(d=>{m[d.id]=d.data()});SHOPDOCS=m;
      if(current==='guest-shop')rerender();
    },()=>{});
  }else{
    MODE='local';
    HOME=lsGet('oshiori-home');if(HOME)HOME=norm(HOME);else if(DEMO)HOME=SAMPLE();
    LOG=lsGet('oshiori-log')||{visits:[]};
    SHOPDOCS=lsGet('oshiori-shop')||{};
  }
  if(HOME)delete HOME.updatedAt;
  if(MODE!=='guest'){
    const dr=lsGet('oshiori-draft');
    DRAFT=dr?norm(dr):(HOME?clone(HOME):EMPTY());
  }
  go(MODE==='guest'?'guest-guide':(hasHome(HOME)&&!DEMO?'host-share':'host-form'));
}
boot();
})();
</script>
